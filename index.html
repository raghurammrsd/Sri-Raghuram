      html, body {

      /* Custom gradient borders */
      .gradient-border-chromatic {
        position: relative;
        background: #ffffff;
        background-clip: padding-box;
        border: 1px solid transparent;
      }
      .gradient-border-chromatic::before {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: -1;
        margin: -1px;
        border-radius: inherit;
        background: linear-gradient(135deg, #790d16 0%, #aec4d4 50%, #e5d3af 100%);
      }
    </style>
